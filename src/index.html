<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer class="footer">
            <div class="container footer__container">
                <div class="footer__info">
                    <h2 class="footer__title">Connect with admissions</h2>
                    <a href="tel:+1234567890" class="footer__link">Admissions: +1 (234) 567-890</a>
                    <a
                        href="https://www.google.com/maps/place/Big+Ben/@51.5007325,-0.1272003,17z/data=!3m2!4b1!5s0x47d8e55e300273ad:0x64ade3f4995c75cd!4m6!3m5!1s0x487604c38c8cd1d9:0xb78f2474b9a45aa9!8m2!3d51.5007292!4d-0.1246254!16zL20vMDI2eWRj?entry=ttu&g_ep=EgoyMDI2MDkyMC4wIKXMDSoASAFQAw%3D%3D"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="footer__link"
                        >Main Campus: 456 Education Way</a
                    >
                </div>

                <div class="footer-links">
                    <a href="https://github.com/Yauheni-Silkou" target="_blank" rel="noopener noreferrer">
                        <img
                            src="https://raw.githubusercontent.com/Yauheni-Silkou/rsschool-cv/45b9cd28ef42ae6eb274fbc7fe58b83052600662/assets/images/cv/footer-github.png"
                            alt="GitHub"
                        />
                    </a>

                    <a
                        href="https://rs.school/courses/javascript"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="https://raw.githubusercontent.com/Yauheni-Silkou/rsschool-cv/45b9cd28ef42ae6eb274fbc7fe58b83052600662/assets/images/cv/footer-rs-school.png"
                            alt="RS School"
                        />
                    </a>
                </div>

                <div class="footer-year">© 2026</div>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
